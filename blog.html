    <title>Blog</title>
    <link rel="stylesheet" href="/style.css" />

      rel="stylesheet"

    <style>
      .blog-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
        justify-content: center;
      }

      .blog-card {
        width: 300px;
        background: #1f2937;
        color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      .blog-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .blog-card h3 {
        color: #f97316;
        padding: 10px;
      }

      .blog-card p {
        padding: 0 10px;
      }

      .read-more {
        display: inline-block;
        margin: 10px;
        color: #f97316;
        text-decoration: none;
      }
    </style>
  </head>
