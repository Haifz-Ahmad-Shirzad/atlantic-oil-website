<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact us</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      /* CONTACT HERO */
      .contact-hero {
        text-align: center;
        padding: 50px 20px;
        background: linear-gradient(to left, #0f172a, #1f2937);
        color: white;
      }

      /* CONTAINER */
      .contact-container {
        display: flex;
        gap: 30px;
        padding: 40px 8%;
        flex-wrap: wrap;
      }

      /* FORM */
      .contact-form {
        flex: 1;
        background: #111827;
        padding: 25px;
        border-radius: 12px;
        color: white;
      }

      .contact-form form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .contact-form input,
      .contact-form textarea {
        padding: 10px;
        border-radius: 6px;
        border: none;
      }

      .contact-form button {
        background: var(--secondary-color);
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
      }

      /* INFO */
      .contact-info {
        flex: 1;
        background: #1f2937;
        padding: 25px;
        border-radius: 12px;
        color: white;
      }

      .contact-info p {
        margin: 10px 0;
      }

      .contact-info i {
        margin-left: 8px;
        color: var(--secondary-color);
      }

      /* MAP */
      .map {
        margin-top: 30px;
      }

      /* MOBILE */
      @media (max-width: 768px) {
        .contact-container {
          flex-direction: column;
        }
      }

      h1,
      h2 {
        margin-bottom: 20px;
      }

      #btn-submit {
        border-radius: 10px;
      }
    </style>
  </head>
  <body dir="rtl">
    <div id="header"></div>
    <section class="contact-hero">
      <h1>زموږ سره اړیکه ونیسئ</h1>
      <p>موږ ستاسو د خدمت لپاره تل چمتو یو</p>
    </section>

    <section class="contact-container">
      <!-- LEFT: FORM -->
      <div class="contact-form">
        <h2>پیغام راولېږئ</h2>

        <form>
          <input type="text" placeholder="ستاسو نوم" required />
          <input type="email" placeholder="ایمیل" required />
          <input type="text" placeholder="موضوع" />
          <textarea placeholder="ستاسو پیغام"></textarea>
          <button type="submit" id="btn-submit">ولېږه</button>
        </form>
      </div>

      <!-- RIGHT: INFO -->
      <div class="contact-info">
        <h2>اړیکه</h2>

        <p><i class="fas fa-phone"></i> 93706429910+</p>
        <p><i class="fas fa-envelope"></i> hafizahmadshirzad@gmail.com</p>
        <p><i class="fas fa-map-marker-alt"></i> کندهار، افغانستان</p>

        <div class="social-icons">
          <i class="fab fa-facebook"></i>
          <i class="fab fa-whatsapp"></i>
          <i class="fab fa-instagram"></i>
        </div>
      </div>
    </section>

    <!-- GOOGLE MAP -->
    <section class="map">
      <iframe
        src="https://www.google.com/maps?q=Hazrat%20Ji%20Baba%20Square%20Kandahar&output=embed"
        width="100%"
        height="400"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
      >
      </iframe>
    </section>
    <!-- <section class="map">
      <iframe
        src="https://www.google.com/maps?q=Hazrat+Ji+Baba+Square+Kandahar&output=embed"
        width="100%"
        height="400"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
      >
      </iframe>
    </section> -->

    <div id="footer"></div>

    <script src="script.js"></script>
  </body>
</html>
