<!doctype html>
<html lang="ps">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | Atlantic Kandahar Agency</title>

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- ICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- FAVICON -->
    <link rel="icon" href="https://atlanticlubes.com/favicon.ico" />
  </head>

  <body dir="rtl">
    <!-- ================= HEADER ================= -->
    <div id="header"></div>

    <!-- ================= PAGE TITLE ================= -->
    <section class="page-title">
      <h1>Our Products | زموږ محصولات</h1>
      <p>Premium Automotive & Industrial Lubricants</p>
    </section>

    <!-- ================= MAIN LAYOUT ================= -->
    <div class="product-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h3>Categories</h3>

        <button onclick="filterByCategory('all')">All</button>
        <button onclick="filterByCategory('Max Power')">Max Power</button>
        <button onclick="filterByCategory('X Series')">X Series</button>
        <button onclick="filterByCategory('Brake Oil')">Brake Oil</button>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="product-main">
        <!-- SEARCH -->
        <input
          type="text"
          placeholder="Search products..."
          oninput="searchProducts(this.value)"
        />

        <!-- LOADER -->
        <div id="loader" class="loader" style="display: none"></div>

        <!-- PRODUCT GRID -->
        <div class="grid" id="productContainer"></div>
      </main>
    </div>

    <!-- ================= FOOTER ================= -->
    <div id="footer"></div>

    <!-- SCRIPT -->
    <script type="module" src="script.js"></script>
  </body>
</html>
