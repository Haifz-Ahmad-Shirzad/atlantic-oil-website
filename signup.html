<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body dir="ltr">
    <div id="header"></div>
    <section class="auth-container">
      <div class="auth-box">
        <h2>ثبت نام (Sign Up)</h2>

        <form class="auth-form" id="signupForm">
          <div class="form-group">
            <label>نوم</label>
            <input type="text" id="name" placeholder="ستاسو نوم" required />
          </div>

          <div class="form-group">
            <label>ایمیل</label>
            <input
              type="email"
              id="email"
              placeholder="example@gmail.com"
              required
            />
          </div>

          <div class="form-group">
            <label>پاسورډ</label>
            <input
              type="password"
              id="password"
              placeholder="********"
              required
            />
          </div>

          <div class="form-group">
            <label>تایید پاسورډ</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="********"
              required
            />
          </div>

          <!-- error message -->
          <p id="errorMsg" class="error"></p>

          <button type="submit" class="auth-btn">ثبت نام</button>

          <p class="switch-auth">
            مخکې حساب لرې؟
            <a href="login.html">ننوتل</a>
          </p>
        </form>
      </div>
    </section>

    <div id="footer"></div>
    <script src="./signup.js"></script>
    <script src="script.js"></script>
  </body>
</html>
