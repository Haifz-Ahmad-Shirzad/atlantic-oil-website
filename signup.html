<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Signup</title>

    <link rel="stylesheet" href="./style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body dir="ltr">
    <!-- HEADER -->
    <div id="header"></div>

    <!-- SIGNUP SECTION -->
    <section class="auth-container">
      <div class="auth-box">
        <h2>ثبت نام (Sign Up)</h2>

        <form class="auth-form" id="signupForm">
          <!-- NAME -->
          <div class="form-group">
            <label for="name">نوم</label>

            <input type="text" id="name" placeholder="ستاسو نوم" />
          </div>

          <!-- EMAIL -->
          <div class="form-group">
            <label for="email">ایمیل</label>

            <input type="email" id="email" placeholder="example@gmail.com" />
          </div>

          <!-- PASSWORD -->
          <div class="form-group">
            <label for="password">پاسورډ</label>

            <input type="password" id="password" placeholder="********" />
          </div>

          <!-- CONFIRM PASSWORD -->
          <div class="form-group">
            <label for="confirmPassword"> تایید پاسورډ </label>

            <input
              type="password"
              id="confirmPassword"
              placeholder="********"
            />
          </div>

          <!-- ERROR -->
          <p id="errorMsg" class="error"></p>

          <!-- BUTTON -->
          <button type="submit" class="auth-btn">ثبت نام</button>

          <!-- SWITCH -->
          <p class="switch-auth">
            مخکې حساب لرې؟

            <a href="login.html">ننوتل</a>
          </p>
        </form>
      </div>
    </section>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- JS -->
    <script type="module" src="./script.js"></script>
    <script src="./signup.js"></script>
  </body>
</html>
