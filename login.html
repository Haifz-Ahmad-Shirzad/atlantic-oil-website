<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body dir="ltr">
    <section class="auth-container">
      <div class="auth-box">
        <h2>ننوتل (Login)</h2>

        <form class="auth-form">
          <div class="form-group">
            <label>ایمیل</label>
            <input type="email" placeholder="example@gmail.com" required />
          </div>

          <div class="form-group">
            <label>پاسورډ</label>
            <input type="password" placeholder="********" required />
          </div>

          <div class="form-options">
            <label>
              <input type="checkbox" />
              ما په یاد وساته
            </label>
            <a href="#">پاسورډ هېر کړی؟</a>
          </div>

          <button type="submit" class="auth-btn">ننوتل</button>

          <p class="switch-auth">
            حساب نه لرې؟
            <a href="signup.html">ثبت نام</a>
          </p>
        </form>
      </div>
    </section>
  </body>
</html>
